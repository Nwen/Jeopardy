services:
  jeopardy:
    build: .
    pull_policy: build # reconstruit l'image à chaque redéploiement (sinon l'ancienne est réutilisée)
    container_name: jeopardy
    ports:
      - "32002:3000"
    volumes:
      - jeopardy-data:/data
    environment:
      - DATABASE_URL=file:/data/jeopardy.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped

volumes:
  jeopardy-data:
